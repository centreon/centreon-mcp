name: CI - Python Code Quality

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - develop
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "centreon_mcp/**"
      - "tests/**"

jobs:
  dependency-scan:
    uses: centreon/security-tools/.github/workflows/dependency-analysis.yml@main

  code-check:
    needs: [dependency-scan]
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Install uv
        uses: astral-sh/setup-uv@fac544c07dec837d0ccb6301d7b5580bf5edae39 # v8.2.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version-file: ".python-version"

      - name: Install the project with dev dependencies
        run: uv sync --dev

      - name: Lint code with Ruff
        run: uv run ruff check --output-format=github .

      - name: Run tests with coverage
        run: |
          uv run coverage run --source centreon_mcp -m pytest tests
          uv run coverage report