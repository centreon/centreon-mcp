name: CI - Python Code Quality

on:
  pull_request:
    types: [opened, synchronize]
    branches:
      - develop
    paths:
      - "pyproject.toml"
      - "uv.lock"
      - "centreon_mcp/**"
      - "tests/**"

jobs:
  dependency-scan:
    uses: centreon/security-tools/.github/workflows/dependency-analysis.yml@main

  code-check:
    needs: [dependency-scan]
    runs-on: ubuntu-latest

    env:
      PYTHONPATH: ${{ github.workspace }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          enable-cache: true
          cache-dependency-glob: "uv.lock"

      - name: Set up Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version-file: ".python-version"

      - name: Install the project with dev dependencies
        run: uv sync --dev

      - name: Lint code with Ruff
        run: uv run ruff check --output-format=github .

      - name: Run tests with coverage
        run: |
          uv run coverage run --source centreon_mcp -m pytest tests
          uv run coverage report