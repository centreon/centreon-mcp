name: mcp

services:
  server:
    image: centreon/mcp:latest
    container_name: server
    ports:
      - ${CENTREON_MCP_PORT:-8000}:8000
    networks:
      - mcp
    environment:
      CENTREON_BASE_URL: ${CENTREON_BASE_URL}
      CENTREON_API_TOKEN: ${CENTREON_API_TOKEN}
      CENTREON_MCP_LOG_LEVEL: ${CENTREON_MCP_LOG_LEVEL:-INFO}
      CENTREON_MCP_HOST: "0.0.0.0"
      CENTREON_MCP_PUBLIC_URL: ${CENTREON_MCP_PUBLIC_URL:-}
      CENTREON_MCP_ICON_URL: ${CENTREON_MCP_ICON_URL:-}
      CENTREON_MCP_WEBSITE_URL: ${CENTREON_MCP_WEBSITE_URL:-}
      CENTREON_AUTH_PLUGIN: ${CENTREON_AUTH_PLUGIN:-none}
      CENTREON_OIDC_CONFIG_URL: ${CENTREON_OIDC_CONFIG_URL:-}
      CENTREON_OIDC_CLIENT_ID: ${CENTREON_OIDC_CLIENT_ID:-}
      CENTREON_OIDC_CLIENT_SECRET: ${CENTREON_OIDC_CLIENT_SECRET:-}
      CENTREON_OIDC_AUDIENCE: ${CENTREON_OIDC_AUDIENCE:-}
      CENTREON_OIDC_SCOPES: ${CENTREON_OIDC_SCOPES:-}
      CENTREON_OIDC_JWT_SIGNING_KEY: ${CENTREON_OIDC_JWT_SIGNING_KEY:-}
      CENTREON_OIDC_ROLE_CLAIM: ${CENTREON_OIDC_ROLE_CLAIM:-}
      CENTREON_OIDC_ROLE_MAPPING: ${CENTREON_OIDC_ROLE_MAPPING:-}
      CENTREON_OIDC_DEFAULT_ROLE: ${CENTREON_OIDC_DEFAULT_ROLE:-}
      CENTREON_OIDC_TENANT_CLAIM: ${CENTREON_OIDC_TENANT_CLAIM:-}
      CENTREON_OIDC_TENANTS: ${CENTREON_OIDC_TENANTS:-}
    extra_hosts: 
      - "host.docker.internal:host-gateway"

  ngrok:
    image: ngrok/ngrok
    container_name: ngrok
    profiles:
      - ngrok
    ports:
      - 4040:4040
    networks:
      - mcp
    environment:
      - NGROK_AUTHTOKEN=${NGROK_AUTHTOKEN}
    command: http server:8000
    


networks:
  mcp:
    driver: bridge